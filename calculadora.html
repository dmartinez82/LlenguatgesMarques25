<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./css/calculadora.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>

    <header>
        <h1>Calculadora Simple</h1>
    </header>

    <main>
        <form id="calculator">
            <input type="number" id="num1" placeholder="Primer número" required>
            <input type="number" id="num2" placeholder="Segon número" required>
            <select id="operation">
                <option value="+">Sumar (+)</option>
                <option value="-">Restar (-)</option>
                <option value="*">Multiplicar (×)</option>
                <option value="/">Dividir (÷)</option>
                <option value="%">Módulo (%)</option>
            </select>
            <button type="button" id="calcular">Calcular</button>
        </form>
        
        <input type="text" id="result" placeholder="Resultat" readonly>
        <button id="limpiarInputs" type="button">Limpiar</button>
    
    </main>

    <div class="historial">
        <label for="historial">Historial de operaciones</label>
        <select name="historial" id="historial" size="10"></select>
        <small class="nota">Nota: Haz clic para recuperar o doble clic para eliminar</small>
        <button id="limpiarHistorial" type="button">Limpiar historial</button>
    </div>

    <script src="./js/calculadora.js" defer></script>
    
</body>
</html>

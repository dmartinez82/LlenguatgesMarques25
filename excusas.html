<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Excusas</title>
    <link rel="stylesheet" href="css/excusas.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">
        <h1>Generador de Excusas 🤷‍♂️</h1>

        <div class="excusa-container">
            <div class="excusa-box">
                <p id="excusa">¡Pulsa el botón para generar una excusa!</p>
            </div>
            <button id="btnCopiar" class="btn-icon" title="Copiar excusa al portapapeles">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>

        <button id="btnGenerar">Generar Excusa</button>
    </div>

    <script src="js/excusas.js"></script>
</body>

</html>
